name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install "setuptools>=77" wheel build ".[notebook,dev]"

      - name: Lint
        run: ruff check digital_compiler tests

      - name: Test
        run: pytest tests

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
