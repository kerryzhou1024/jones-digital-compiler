name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install "setuptools>=77" wheel ".[notebook,dev]"

      - name: Lint
        run: ruff check digital_compiler tests

      - name: Test
        run: pytest tests

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
